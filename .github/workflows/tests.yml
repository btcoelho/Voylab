name: tests
on:
  push:
  pull_request:
jobs:
  tronco01:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Manifest integrity
        working-directory: research/TRONCO-01
        run: python tools/verify_manifest.py
      - name: v2.7 harness
        working-directory: research/TRONCO-01/src/tronco01_v2_7
        run: |
          python -m unittest discover -s tests
          python mutation_check.py > /dev/null
          python replay.py --trial-dir fixtures/v23 > /dev/null
      - name: Admissible hypothesis sets
        working-directory: research/TRONCO-01/hypothesis_sets
        run: |
          python -m unittest discover -s tests
          python mutation_check.py > /dev/null
      - name: M17 audit (dev split only)
        working-directory: research/TRONCO-01/src/m17_audit
        run: python -m unittest discover -s tests
